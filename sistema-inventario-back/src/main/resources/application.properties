# ==========================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================
server.port=8080

# ==========================
# CONFIGURACIÓN BASE DE DATOS
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# CONFIGURACIÓN JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================
# CONFIGURACIÓN GENERAL
# ==========================
spring.jackson.time-zone=America/Bogota

# ==========================
# CONFIGURACIÓN JWT
# ==========================
jwt.secret=${JWT_SECRET:defaultDevSecretChangeInProduction123456789}
jwt.expiration=86400000

# ==========================
# EVITAR CONFLICTOS DE BEANS
# ==========================
spring.main.allow-bean-definition-overriding=true

# ==========================
# LOGGING
# ==========================
logging.level.root=INFO
logging.level.com.cantero.sistema_inventario=INFO